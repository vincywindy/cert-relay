name: Test and publish container

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Shell static analysis
        run: shellcheck scripts/*.sh tests/*.sh
      - name: Build exact runtime image
        run: docker build -t cert-relay:test .
      - name: Script behavior tests in Alpine
        run: >-
          docker run --rm --entrypoint /bin/sh
          -v "$PWD/tests:/tests:ro"
          cert-relay:test /tests/sync.sh /usr/local/bin/cert-sync
      - name: Actual Traefik compatibility, reload and shutdown tests
        run: python3 tests/container.py cert-relay:test
      - name: General folder synchronization and live configuration reload
        run: |
          docker run --rm --entrypoint /bin/bash -v "$PWD:/project:ro" cert-relay:test /project/tests/folders.sh
          docker run --rm --entrypoint /bin/sh -v "$PWD:/project:ro" cert-relay:test -c 'apk add --no-cache curl >/dev/null && bash /project/tests/folder-reload.sh'
      - name: Validate Swarm example
        run: |
          docker stack config -c examples/stack.yml > /dev/null
          docker stack config -c examples/folders-stack.yml > /dev/null

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - name: Registry image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: latest=false
          # run_number matches this workflow's UI sequence (#1, #2); reruns keep the same number.
          tags: |
            type=raw,value=${{ github.run_number }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Published image name
        env:
          IMAGE: ${{ steps.image.outputs.name }}:${{ github.run_number }}
        run: echo "Image workflow run number tag = $IMAGE" >> "$GITHUB_STEP_SUMMARY"

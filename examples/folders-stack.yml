# Before deployment: replace the image workflow run number (#1, #2) and label eligible nodes.
# Each eligible node must have /mnt/acme-publish (NFS) and /var/lib/traefik-sync (LOCAL disk).
services:
  traefik:
    image: ${TRAEFIK_SYNC_IMAGE:-ghcr.io/vincywindy/cert-relay:1}
    command:
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --providers.file.directory=/local/dynamic
      - --providers.file.watch=true
      # Add your existing Swarm provider configuration here if required.
      # Remove certResolver references when certificates are supplied by the external ACME client.
    environment:
      SYNC_MODE: folders
      # Pairs are processed in this order. Certificate files should arrive before configs that reference them.
      SYNC_PAIRS: |
        /source/certs|/local/certs
        /source/dynamic|/local/dynamic
      SYNC_INTERVAL_SECS: "60"
      SYNC_MIN_AGE_SECS: "10"
      SYNC_COMPARE: content
      # This must be a real existing dynamic config, copied by a pair or provisioned locally.
      SYNC_RELOAD_FILE: /local/dynamic/tls.yml
    volumes:
      - type: bind
        source: /mnt/acme-publish
        target: /source
        read_only: true
      - type: bind
        source: /var/lib/traefik-sync
        target: /local
    ports:
      - target: 80
        published: 80
        protocol: tcp
        mode: host
      - target: 443
        published: 443
        protocol: tcp
        mode: host
    stop_grace_period: 20s
    healthcheck:
      test: ["CMD", "/usr/local/bin/folder-sync-healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    deploy:
      mode: global
      placement:
        constraints:
          - node.labels.traefik == true
      update_config:
        order: stop-first
      restart_policy:
        condition: any
        delay: 5s
      resources:
        # Optional example limits for BOTH Traefik and sync; tune for actual proxy traffic.
        limits:
          memory: 256M

# Copy examples/folders-tls.yml into /mnt/acme-publish/dynamic/tls.yml and publish real PEM files under certs/.
